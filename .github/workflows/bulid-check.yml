name: Docker Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Verify Docker build
      run: docker build -t trading-journal-test .

    - name: Deploy to GCP via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        command_timeout: 30m
        script: |
          cd ~/Trading_Journel
          git pull origin main
          
          # 1. Build the image FIRST to utilize the cache
          sudo docker build -t trading-journal-app .
          
          # 2. Swap the containers
          sudo docker rm -f journal-app || true
          sudo docker run -d -p 8080:8080 -v $(pwd):/app --name journal-app --restart always trading-journal-app
          
          # 3. Clean up the disk space AFTER the deployment is finished
          sudo docker system prune -af